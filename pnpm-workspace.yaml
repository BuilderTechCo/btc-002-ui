# @buildertech Monorepo - pnpm Workspace
# Configuración de workspaces para monorepo

packages:
  - "packages/*"
  - "apps/*"

allowBuilds:
  core-js-pure: true
  esbuild: true
  sharp: true

catalog:
  # React ecosystem
  react: "18.3.1"
  react-dom: "18.3.1"
  "@types/react": "18.3.12"
  "@types/react-dom": "18.3.1"

  # Tailwind
  tailwindcss: "3.4.14"
  tailwind-merge: "2.5.4"

  # Testing
  playwright: "1.48.1"
  "@playwright/test": "1.48.1"
  tsx: "4.19.1"

  # Code quality
  typescript: "5.6.3"
  eslint: "9.13.0"
  "@eslint/js": "9.13.0"
  typescript-eslint: "8.11.0"
  prettier: "3.3.3"
  eslint-config-prettier: "9.1.0"

  # Utilities
  clsx: "2.1.1"
  lucide-react: "0.453.0"
  glob: "11.0.0"
  changesets: "2.27.9"

  # Next.js (apps/web)
  next: "14.2.16"